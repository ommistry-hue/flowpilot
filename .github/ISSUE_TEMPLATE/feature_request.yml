name: Feature request
description: Suggest an improvement to the engine, designer or API.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/ommistry-hue/flowpilot/blob/main/ROADMAP.md) first. If it is already there, a 👍 on the existing issue helps us prioritise.
        Want a new integration or node? Use the **New activity** template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Sketches, JSON or API shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Engine / durable execution
        - Designer (UI)
        - HTTP API
        - Expressions
        - AI generation
        - Plugins / SDK
        - Deployment / Docker
        - Docs
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this.
