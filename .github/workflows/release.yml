name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # NuGet trusted publishing (OIDC)

jobs:
  nuget:
    name: Publish NuGet packages
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test FlowPilot.slnx -c Release

      - name: Pack
        run: |
          dotnet pack src/FlowPilot.Abstractions -c Release -o artifacts -p:Version=$VERSION
          dotnet pack src/FlowPilot.Core -c Release -o artifacts -p:Version=$VERSION

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "FlowPilot $GITHUB_REF_NAME" --generate-notes --verify-tag
