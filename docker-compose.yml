name: flowpilot

services:
  flowpilot:
    image: ghcr.io/ommistry-hue/flowpilot:latest
    build: .
    restart: unless-stopped
    ports:
      - "5080:5080"
    env_file:
      - path: .env
        required: false
    environment:
      FlowPilot__ApiKey: ${FLOWPILOT_API_KEY:?set FLOWPILOT_API_KEY in .env}
      FlowPilot__Database__Provider: postgres
      ConnectionStrings__FlowPilot: "Host=postgres;Port=5432;Database=flowpilot;Username=flowpilot;Password=${POSTGRES_PASSWORD:-flowpilot}"
    volumes:
      - flowpilot-data:/data
      - ./plugins:/app/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The aspnet base image has no curl; use bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot -d flowpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowpilot-data:
  postgres-data:
